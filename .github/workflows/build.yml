name: Build

# Shared build steps for release.yml and test-build.yml, so the two cannot
# drift. Permissions come from the calling job: release.yml grants
# `contents: write` (tauri-action uploads to the draft release), test-build.yml
# keeps `contents: read`.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out. Empty builds the ref the caller runs on.
        required: false
        default: ''
        type: string
      publish:
        description: >-
          true: build with tauri-action and upload to the draft release.
          false: plain `tauri build` and upload the installers as a run artifact.
        required: false
        default: false
        type: boolean
      updater-artifacts:
        description: >-
          Publish .sig files and latest.json (publish mode). Test mode always
          switches createUpdaterArtifacts off, so no signing key is needed.
        required: false
        default: false
        type: boolean
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle-dir: src-tauri/target/universal-apple-darwin/release/bundle
          - name: windows
            os: windows-latest
            args: ''
            rust-targets: ''
            bundle-dir: src-tauri/target/release/bundle
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Publish mode. release-please.yml creates the tag and a draft release;
      # releaseDraft must stay true so tauri-action finds that draft by tag and
      # uploads to it instead of creating a second release.
      #
      # Binaries are unsigned (no Apple or Windows code-signing secrets);
      # macOS gets an ad-hoc signature from tauri.conf.json. While
      # updater-artifacts is true the updater bundles, .sig files and
      # latest.json are built and uploaded; the signing env below signs them.
      - uses: tauri-apps/tauri-action@v1
        if: inputs.publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Tokenmonk v__VERSION__
          releaseBody: Unsigned build. See the assets to download and install.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: ${{ inputs.updater-artifacts }}
          uploadUpdaterSignatures: ${{ inputs.updater-artifacts }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # Test mode: unsigned installers as a run artifact, no release, no tag.
      # createUpdaterArtifacts is true in tauri.conf.json, so it is switched
      # off with --config.
      - name: Build installers
        if: ${{ !inputs.publish }}
        shell: bash
        run: npx tauri build ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Short SHA
        if: ${{ !inputs.publish }}
        id: sha
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.publish }}
        with:
          name: tokenmonk-${{ matrix.name }}-${{ steps.sha.outputs.short }}
          path: |
            ${{ matrix.bundle-dir }}/dmg/*.dmg
            ${{ matrix.bundle-dir }}/msi/*.msi
            ${{ matrix.bundle-dir }}/nsis/*.exe
          retention-days: 1
          if-no-files-found: error
