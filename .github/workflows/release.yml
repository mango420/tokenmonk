name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to build, for example v0.3.0. Start the run from
          main: the tag's code is built, the guard script comes from main.
          Leave empty to build the ref the run starts from.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # What the run builds: the `tag` input of a dispatch, otherwise the ref the
  # run starts from (the pushed tag, or the tag release-please dispatches on).
  BUILD_REF: ${{ inputs.tag || github.ref }}
  BUILD_TAG: ${{ inputs.tag || github.ref_name }}
  # Updater artifacts are on (docs/DECISIONS.md, "v0.1 without updater artifacts", update 2026-11-04):
  # builds are signed with the TAURI_SIGNING_PRIVATE_KEY secrets and publish .sig files and latest.json.
  # Setting this to 'false' requires createUpdaterArtifacts to be unset or false in tauri.conf.json.
  UPDATER_ARTIFACTS: 'true'

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      updater-artifacts: ${{ env.UPDATER_ARTIFACTS }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The guard script comes from the commit the run started from, the tree
      # and history it scans from BUILD_REF. On a tag push both are the same
      # commit; a dispatch from main with `tag` rebuilds an older tag with the
      # current guard rules (docs/DECISIONS.md, "Release ownership").
      - name: Guard
        run: |
          git cat-file -e "${GITHUB_SHA}^{commit}" 2>/dev/null \
            || git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "${GITHUB_SHA}:scripts/guard.mjs" > "$RUNNER_TEMP/guard.mjs"
          node "$RUNNER_TEMP/guard.mjs" --all

      - name: Check updater signing secrets are set
        if: env.UPDATER_ARTIFACTS == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is not set"
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set"
            exit 1
          fi

      - name: Check updater config matches UPDATER_ARTIFACTS
        run: |
          node -e "
            const on = process.env.UPDATER_ARTIFACTS === 'true';
            const c = require('./src-tauri/tauri.conf.json');
            const errors = [];
            const artifacts = !!(c.bundle && c.bundle.createUpdaterArtifacts === true);
            if (artifacts !== on) {
              errors.push('bundle.createUpdaterArtifacts must be ' + on + ' while UPDATER_ARTIFACTS is ' + on);
            }
            const pubkey = c.plugins && c.plugins.updater && c.plugins.updater.pubkey;
            if (on && (typeof pubkey !== 'string' || pubkey.trim() === '')) {
              errors.push('plugins.updater.pubkey is empty');
            }
            for (const e of errors) console.log('::error::tauri.conf.json: ' + e);
            process.exit(errors.length ? 1 : 0);
          "

      - name: Check tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        run: |
          if ! git rev-parse -q --verify "refs/tags/${BUILD_TAG}" >/dev/null; then
            echo "::error::${BUILD_TAG} is not a tag"
            exit 1
          fi
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          pkg="$(node -p "require('./package.json').version")"
          cargo="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)"
          status=0
          for pair in "tauri.conf.json:${conf}" "package.json:${pkg}" "Cargo.toml:${cargo}"; do
            file="${pair%%:*}"
            ver="${pair#*:}"
            if [ "${BUILD_TAG}" != "v${ver}" ]; then
              echo "::error::Tag ${BUILD_TAG} does not match ${file} version v${ver}"
              status=1
            fi
          done
          exit "$status"

  # The build steps are shared with test-build.yml (build.yml). This job grants
  # contents: write, since a called workflow cannot raise permissions.
  build:
    name: build
    needs: guard
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
      publish: true
      updater-artifacts: ${{ needs.guard.outputs.updater-artifacts == 'true' }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
