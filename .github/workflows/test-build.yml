name: Test build

# Unsigned test installers from `dev` (docs/RELEASE-FLOW.md, "Test build").
# The build steps live in build.yml, shared with release.yml. No release, no
# tag, no secrets: updater artifacts are switched off for these builds, so no
# signing key is needed.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: test build
    uses: ./.github/workflows/build.yml
    with:
      publish: false
      updater-artifacts: false
