name: Issue key

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  key:
    name: prefix title and check type label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const n = issue.number;
            const key = `TKM-${n}`;
            const { owner, repo } = context.repo;

            // 1. Title prefix (idempotent). "TKM-<m> foo" and "TKM-<m>: foo" both
            // become "TKM-<n>: foo"; see scripts/issue-title.mjs.
            const { normalizeTitle } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/issue-title.mjs`
            );
            const title = normalizeTitle(issue.title, n);
            if (title !== issue.title) {
              await github.rest.issues.update({ owner, repo, issue_number: n, title });
            }

            // 2. Type label check, one comment at most.
            const types = ['feature', 'bug', 'chore'];
            const labels = issue.labels.map((l) => (typeof l === 'string' ? l : l.name));
            if (types.some((t) => labels.includes(t))) return;

            const marker = '<!-- tkm-type-label -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: n,
              per_page: 100,
            });
            if (comments.some((c) => c.body && c.body.includes(marker))) return;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: n,
              body: `${marker}\n${key} has no type label. Add one of: feature, bug, chore.`,
            });
