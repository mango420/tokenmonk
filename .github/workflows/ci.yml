name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  # Started by feature-register.yml for the refresh branch: PRs made with
  # GITHUB_TOKEN start no pull_request runs, workflow_dispatch does.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      # Tauri needs frontendDist to exist before cargo compiles.
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tsc --noEmit
      - run: node scripts/guard.mjs
      - run: node scripts/check-hook-modes.mjs
      # Quoted so Node expands the glob itself (directory args fail on Node 22).
      - run: node --test "tests/scripts/*.test.mjs"

  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: node scripts/guard.mjs --all

      - name: Guard the pull request range
        if: github.event_name == 'pull_request'
        run: node scripts/guard.mjs --range origin/${{ github.base_ref }}..HEAD

      - name: Guard the dispatched branch range
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The dispatched branch is a PR head: use its open PR's base, dev by default.
          base="$(gh pr list --head "${{ github.ref_name }}" --state open --json baseRefName --jq '.[0].baseRefName // "dev"')"
          git fetch --quiet origin "$base"
          node scripts/guard.mjs --range "origin/${base}..HEAD"
