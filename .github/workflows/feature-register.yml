name: Feature register

# Regenerates docs/FEATURES.md from the issue tracker and keeps one refresh PR
# open on a fixed branch. The branch name is skipped by scripts/check-pr-key.mjs.

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: feature-register
  cancel-in-progress: false

env:
  REFRESH_BRANCH: register/refresh
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  refresh:
    name: refresh feature register
    # workflow_dispatch can be started from any ref; only the default branch may publish.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Regenerate docs/FEATURES.md
        run: node scripts/features.mjs

      - name: Detect changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- docs/FEATURES.md)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # PRs and pushes made with GITHUB_TOKEN do not start pull_request workflows,
      # so the repository guard runs here, before anything is pushed.
      - name: Guard
        if: steps.diff.outputs.changed == 'true'
        run: |
          git add docs/FEATURES.md
          printf 'docs: refresh feature register\n' > "$RUNNER_TEMP/commit-msg.txt"
          node scripts/guard.mjs --staged --msg "$RUNNER_TEMP/commit-msg.txt"

      - name: Push refresh branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -F "$RUNNER_TEMP/commit-msg.txt"
          git push --force origin "HEAD:refs/heads/${REFRESH_BRANCH}"

      - name: Open the refresh PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          existing="$(gh pr list --head "$REFRESH_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Refresh branch updated; PR #${existing} is already open." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! gh pr create --base main --head "$REFRESH_BRANCH" \
              --title 'docs: refresh feature register' \
              --body "Regenerated docs/FEATURES.md with scripts/features.mjs from the issue tracker."; then
            {
              echo "The branch \`${REFRESH_BRANCH}\` was updated, but the pull request could not be created."
              echo "Open it by hand: base \`main\`, head \`${REFRESH_BRANCH}\`, title \`docs: refresh feature register\`."
              echo "Creating it automatically needs Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The register on main already matches the tracker: retire a stale refresh PR.
      - name: Close stale refresh PR
        if: steps.diff.outputs.changed == 'false'
        run: |
          existing="$(gh pr list --head "$REFRESH_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          [ -z "$existing" ] && exit 0
          if ! gh pr close "$existing" --delete-branch --comment 'The register on main is current again.'; then
            echo "Could not close stale refresh PR #${existing}; close it by hand." >> "$GITHUB_STEP_SUMMARY"
          fi
