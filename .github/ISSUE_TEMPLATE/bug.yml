name: Bug
description: Something behaves wrongly
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed
      description: What happens? Use synthetic or redacted data only, no real logs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: false
