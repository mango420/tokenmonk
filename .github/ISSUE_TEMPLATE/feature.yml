name: Feature
description: New behaviour or capability
labels: [feature]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be possible afterwards?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: How do we know it is done?
    validations:
      required: true
